<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — AWAL Minigames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.reset-shell{max-width:520px;margin:9vh auto;padding:36px;background:#fff;border:2px solid #181818;box-shadow:8px 8px 0 #181818;border-radius:18px}.reset-shell h1{font-family:Bungee,sans-serif;font-size:clamp(24px,4vw,34px);line-height:1.2}.reset-shell p{line-height:1.55}.reset-shell .field{margin:18px 0}.reset-shell input{width:100%;box-sizing:border-box}.auth-message{padding:12px 14px;margin:14px 0;border:1px solid #c9c9c9;border-radius:10px;line-height:1.45}.auth-message.error{background:#fff0f0;border-color:#d44;color:#8c1515}.auth-message.success{background:#e9fff1;border-color:#35a866;color:#145d32}.auth-message.info{background:#eef8ff;border-color:#72b7e8;color:#174c70}
</style>
</head><body>
<div class="reset-shell">
<a href="index.html" class="logo"><svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true"><path d="M20 6 L34 32 L6 32 Z" fill="none" stroke="#C837E8" stroke-width="3.2" stroke-linejoin="round"/><path d="M20 34 L6 8 L34 8 Z" fill="none" stroke="#4DD8F0" stroke-width="3.2" stroke-linejoin="round"/></svg>AWAL</a>
<h1>Choose a new password</h1><p>Enter your new password below.</p>
<div id="reset-message" class="auth-message" role="status" aria-live="polite" style="display:none"></div>
<div class="field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
<button id="save-password" class="btn btn-primary" type="button">Save new password</button>
<p><a href="login.html">Back to log in</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script>
<script>
(function(){const client=window.awalSupabase;const msg=document.getElementById('reset-message');const btn=document.getElementById('save-password');function say(t,k){msg.textContent=t;msg.className='auth-message '+k;msg.style.display='block';}if(!client)return;client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')say('Recovery link verified. Choose your new password.','success');});btn.addEventListener('click',async()=>{const password=document.getElementById('new-password').value;if(password.length<8){say('Use at least 8 characters for your password.','error');return;}btn.disabled=true;btn.textContent='Saving…';try{const {error}=await client.auth.updateUser({password});if(error)throw error;say('Password updated. You can now log in with your new password.','success');btn.textContent='Password saved';}catch(e){say(e.message||'Could not update your password. Open the latest reset email link and try again.','error');btn.disabled=false;btn.textContent='Save new password';}});})();
</script></body></html>
