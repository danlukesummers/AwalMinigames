<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join a game — AWAL Minigames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="max-width:440px; width:100%; background:var(--chalk); border:1.5px solid var(--line); border-radius:20px; padding:36px; text-align:center; box-shadow:0 4px 24px rgba(30,27,46,0.06);">

    <a href="index.html" style="text-decoration:none; color:inherit; display:inline-flex; align-items:center; gap:8px; font-family:'Bungee'; font-size:20px; margin-bottom:26px;">
      <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true" focusable="false"><path d="M20 6 L34 32 L6 32 Z" fill="none" stroke="#C837E8" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M20 34 L6 8 L34 8 Z" fill="none" stroke="#4DD8F0" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      AWAL
    </a>

    <!-- STEP 1: enter code + name -->
    <div id="join-form-step">
      <h1 style="font-size:22px; margin-bottom:8px;">Join a game</h1>
      <p style="color:var(--ink-soft); font-size:14px; margin-bottom:24px;">Enter the 6-digit code your teacher shared.</p>

      <input type="text" id="join-code-input" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="123456"
        style="width:100%; box-sizing:border-box; text-align:center; font-family:'Space Mono',monospace; font-size:26px; letter-spacing:0.3em; padding:14px; border-radius:12px; border:1.5px solid var(--line); margin-bottom:14px;">

      <input type="text" id="join-name-input" maxlength="24" autocomplete="off" placeholder="Your name"
        style="width:100%; box-sizing:border-box; font-family:'Space Grotesk',sans-serif; font-size:15px; padding:13px 16px; border-radius:12px; border:1.5px solid var(--line); margin-bottom:18px;">

      <button class="btn btn-primary btn-block" id="join-submit-btn" onclick="handleJoinSubmit()">Join room</button>
      <p id="join-error" style="color:var(--coral-deep); font-size:13px; margin-top:12px; display:none;"></p>
    </div>

    <!-- STEP 2: waiting for the teacher to start -->
    <div id="join-waiting-step" style="display:none;">
      <div style="font-size:38px; margin-bottom:10px;">🎮</div>
      <h1 style="font-size:22px; margin-bottom:8px;">You're in, <span id="join-player-name"></span>!</h1>
      <p style="color:var(--ink-soft); font-size:14px;">Waiting for your teacher to start the game…</p>
      <div style="margin:20px auto 0; width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--coral); border-radius:50%; animation:join-spin 0.8s linear infinite;"></div>
    </div>

    <!-- STEP 3: live play -- student guesses letters here, on their own device -->
    <div id="join-play-step" style="display:none; text-align:left;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <span class="mono" style="font-size:13px; color:var(--ink-soft);">Word <span id="join-word-idx">1</span> / <span id="join-word-total">–</span></span>
        <span class="mono" style="font-size:13px; color:var(--ink-soft);"><span id="join-misses">0</span> / 6 wrong</span>
      </div>

      <!-- Hint UI -->
      <div id="join-hint-wrap" style="text-align:center; margin-bottom: 12px;">
        <button id="join-hint-btn" class="btn btn-ghost btn-sm" onclick="handleStudentHintClick()">💡 Need a hint?</button>
        <p id="join-hint-text" style="display:none; font-size:13px; font-weight:600; color:var(--purple); margin-top:6px; background:rgba(168,85,247,0.1); padding:6px 10px; border-radius:8px;"></p>
      </div>

      <!-- SVG Hangman Gallows Visual -->
      <div class="hg-figure-wrap" style="text-align:center; margin-bottom:14px;">
        <svg id="join-figure" viewBox="0 0 200 220" width="100%" style="max-width:160px; margin:0 auto; display:block;">
          <line x1="20" y1="210" x2="140" y2="210" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
          <line x1="50" y1="210" x2="50" y2="20" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
          <line x1="50" y1="20" x2="130" y2="20" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
          <line x1="130" y1="20" x2="130" y2="45" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>

          <!-- 6 Body Parts -->
          <circle id="join-part-head" cx="130" cy="62" r="17" fill="none" stroke="var(--coral)" stroke-width="4" style="display:none;"/>
          <line id="join-part-body" x1="130" y1="79" x2="130" y2="135" stroke="var(--coral)" stroke-width="4" stroke-linecap="round" style="display:none;"/>
          <line id="join-part-arm-l" x1="130" y1="95" x2="108" y2="120" stroke="var(--coral)" stroke-width="4" stroke-linecap="round" style="display:none;"/>
          <line id="join-part-arm-r" x1="130" y1="95" x2="152" y2="120" stroke="var(--coral)" stroke-width="4" stroke-linecap="round" style="display:none;"/>
          <line id="join-part-leg-l" x1="130" y1="135" x2="112" y2="170" stroke="var(--coral)" stroke-width="4" stroke-linecap="round" style="display:none;"/>
          <line id="join-part-leg-r" x1="130" y1="135" x2="150" y2="170" stroke="var(--coral)" stroke-width="4" stroke-linecap="round" style="display:none;"/>
        </svg>
      </div>

      <div id="join-word-display" class="hg-word-display" style="justify-content:center; margin-bottom:12px;"></div>
      <div id="join-feedback" class="hg-feedback" style="text-align:center; margin-bottom:10px;"></div>
      <div id="join-keyboard" class="hg-keyboard"></div>
    </div>

    <!-- STEP 4: this student is done with the current word, others still going -->
    <div id="join-waiting-others-step" style="display:none;">
      <div style="font-size:38px; margin-bottom:10px;">⏳</div>
      <h1 style="font-size:20px; margin-bottom:8px;" id="join-waiting-others-title">Nice work!</h1>
      <p style="color:var(--ink-soft); font-size:14px;">Waiting for the rest of the class to finish this word…</p>
    </div>

    <!-- STEP 5: whole round is over -->
    <div id="join-done-step" style="display:none;">
      <div style="font-size:38px; margin-bottom:10px;">🏁</div>
      <h1 style="font-size:20px; margin-bottom:8px;">That's the round!</h1>
      <p style="color:var(--ink-soft); font-size:14px;">Check your teacher's screen to see how the class did.</p>
    </div>

  </div>
</div>

<style>
  @keyframes join-spin { to { transform: rotate(360deg); } }
</style>

<script type="module" src="lobby.js"></script>
<script>
  // Pre-fill code if opened via shared link
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if(code) document.getElementById('join-code-input').value = code;
  });

  async function waitForLobbySupabase(){
    if(window.LobbySupabase) return;
    await new Promise(resolve => {
      const check = setInterval(() => {
        if(window.LobbySupabase){ clearInterval(check); resolve(); }
      }, 50);
    });
  }

  function showJoinError(message){
    const errorEl = document.getElementById('join-error');
    errorEl.textContent = message;
    errorEl.style.display = 'block';
  }

  function hideAllJoinSteps(){
    ['join-form-step','join-waiting-step','join-play-step','join-waiting-others-step','join-done-step']
      .forEach(id => document.getElementById(id).style.display = 'none');
  }

  /* ============ HINT DICTIONARY ============ */
  const JOIN_HINTS = {
    "banana": "A yellow tropical fruit rich in potassium.",
    "umbrella": "Used to stay dry when it rains.",
    "bicycle": "A two-wheeled vehicle you pedal.",
    "mountain": "A very tall, steep natural elevation of the earth.",
    "kitchen": "The room in a house where food is cooked.",
    "elephant": "The largest living land mammal, known for its trunk.",
    "holiday": "A time of rest or vacation away from school/work.",
    "sandwich": "Food placed between two slices of bread.",
    "airport": "A complex where airplanes take off and land.",
    "calendar": "A chart showing days, weeks, and months of a year.",
    "hospital": "An institution where sick or injured people receive medical care.",
    "pyjamas": "Clothes worn for sleeping.",
    "dolphin": "An intelligent marine mammal with a curved beak.",
    "backpack": "A bag carried on your back using straps.",
    "library": "A place containing books and resources to read or borrow.",
    "weather": "The day-to-day state of the atmosphere (rain, heat, wind).",
    "birthday": "The anniversary of the day on which a person was born.",
    "suitcase": "A luggage case used to pack clothes for traveling.",
    "envelope": "A paper container used to enclose letters.",
    "volcano": "A mountain with a crater that spews lava and ash."
  };

  /* ============ live game state for this student ============ */
  let joinLobbyRow = null;   // { id, words, current_word_index, status, ... }
  let joinPlayer = null;     // { id, name }
  let joinGuessed = [];
  let joinMisses = 0;
  let joinDone = false;
  const JOIN_PARTS = ['head','body','arm-l','arm-r','leg-l','leg-r'];

  function joinCurrentWord(){
    const words = (joinLobbyRow && joinLobbyRow.words) || [];
    return words[joinLobbyRow.current_word_index || 0] || '';
  }

  function showStudentHint(customHintText){
    const currentWord = joinCurrentWord();
    const hintTextEl = document.getElementById('join-hint-text');
    const hintBtnEl = document.getElementById('join-hint-btn');

    const hint = customHintText || JOIN_HINTS[currentWord] ||
      ('Starts with "' + currentWord.charAt(0).toUpperCase() + '" and ends with "' + currentWord.charAt(currentWord.length - 1).toUpperCase() + '".');

    if(hintTextEl){
      hintTextEl.textContent = '💡 Hint: ' + hint;
      hintTextEl.style.display = 'block';
    }
    if(hintBtnEl){
      hintBtnEl.disabled = true;
    }
  }

  function handleStudentHintClick(){
    showStudentHint();
  }

  function updateGallowsVisual(missCount){
    JOIN_PARTS.forEach((part, idx) => {
      const el = document.getElementById('join-part-' + part);
      if(el) el.style.display = idx < missCount ? 'block' : 'none';
    });
  }

  function joinRenderWord(){
    const word = joinCurrentWord();
    document.getElementById('join-word-display').innerHTML = word.split('').map(ch =>
      '<div class="hg-letter-box">' + (joinGuessed.includes(ch) ? ch : '') + '</div>'
    ).join('');
  }

  function joinRenderKeyboard(){
    const kb = document.getElementById('join-keyboard');
    kb.innerHTML = '';
    'abcdefghijklmnopqrstuvwxyz'.split('').forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'hg-key';
      btn.textContent = letter;
      if(joinGuessed.includes(letter)) btn.disabled = true;
      btn.onclick = () => joinGuess(letter, btn);
      kb.appendChild(btn);
    });
  }

  async function joinGuess(letter, btn){
    if(joinDone || joinGuessed.includes(letter)) return;
    joinGuessed.push(letter);
    btn.disabled = true;

    const word = joinCurrentWord();
    let won = false;

    if(word.includes(letter)){
      btn.classList.add('correct');
      joinRenderWord();
      won = word.split('').every(ch => joinGuessed.includes(ch));
    } else {
      btn.classList.add('wrong');
      joinMisses++;
      document.getElementById('join-misses').textContent = joinMisses;
      updateGallowsVisual(joinMisses);
    }

    joinDone = won || joinMisses >= 6;

    const fb = document.getElementById('join-feedback');
    if(joinDone){
      document.querySelectorAll('#join-keyboard .hg-key').forEach(k => k.disabled = true);
      if(won){
        fb.textContent = '🎉 You got it!';
        fb.className = 'hg-feedback win';
      } else {
        document.getElementById('join-word-display').innerHTML =
          word.split('').map(ch => '<div class="hg-letter-box">' + ch + '</div>').join('');
        fb.textContent = '💀 Out of guesses. The word was "' + word + '"';
        fb.className = 'hg-feedback lose';
      }
    }

    // Push progress write up to Supabase
    await window.LobbySupabase.upsertProgress(
      joinLobbyRow.id,
      joinPlayer.id,
      joinPlayer.name,
      joinLobbyRow.current_word_index || 0,
      joinGuessed,
      joinMisses,
      joinDone,
      won
    );

    if(joinDone){
      setTimeout(() => {
        hideAllJoinSteps();
        document.getElementById('join-waiting-others-title').textContent = won ? 'Nice work!' : 'Word revealed!';
        document.getElementById('join-waiting-others-step').style.display = 'block';
      }, 900);
    }
  }

  function joinStartWord(){
    joinGuessed = [];
    joinMisses = 0;
    joinDone = false;

    // Reset Hint UI & Gallows
    const hintBtn = document.getElementById('join-hint-btn');
    const hintText = document.getElementById('join-hint-text');
    if(hintBtn) hintBtn.disabled = false;
    if(hintText){ hintText.style.display = 'none'; hintText.textContent = ''; }
    updateGallowsVisual(0);

    document.getElementById('join-misses').textContent = '0';
    document.getElementById('join-word-idx').textContent = (joinLobbyRow.current_word_index || 0) + 1;
    document.getElementById('join-word-total').textContent = (joinLobbyRow.words || []).length;
    document.getElementById('join-feedback').textContent = '';
    document.getElementById('join-feedback').className = 'hg-feedback';
    joinRenderWord();
    joinRenderKeyboard();
    hideAllJoinSteps();
    document.getElementById('join-play-step').style.display = 'block';
  }

  async function handleJoinSubmit(){
    document.getElementById('join-error').style.display = 'none';

    const code = document.getElementById('join-code-input').value.trim();
    const name = document.getElementById('join-name-input').value.trim();

    if(!/^\d{6}$/.test(code)){
      showJoinError('Enter the 6-digit code exactly as your teacher gave it.');
      return;
    }
    if(!name){
      showJoinError("Enter your name so your teacher can see you've joined.");
      return;
    }

    const submitBtn = document.getElementById('join-submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Joining…';

    await waitForLobbySupabase();

    const lobby = await window.LobbySupabase.findLobbyByCode(code);
    if(!lobby){
      showJoinError('No room found with that code. Double-check it and try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Join room';
      return;
    }
    if(lobby.status !== 'waiting'){
      showJoinError('This room has already started or finished.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Join room';
      return;
    }

    const player = await window.LobbySupabase.joinLobby(lobby.id, name);
    if(!player){
      showJoinError('Could not join the room — check your connection and try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Join room';
      return;
    }

    joinLobbyRow = lobby;
    joinPlayer = player;

    document.getElementById('join-player-name').textContent = name;
    hideAllJoinSteps();
    document.getElementById('join-waiting-step').style.display = 'block';

    // Subscribe to realtime broadcasts for live teacher hints
    if(window.LobbySupabase.listenForBroadcasts){
      window.LobbySupabase.listenForBroadcasts(lobby.id, (payload) => {
        if(payload && payload.payload && payload.payload.hint){
          showStudentHint(payload.payload.hint);
        }
      });
    }

    // Subscribe to lobby updates
    window.LobbySupabase.subscribeToLobby(lobby.id, (updatedLobby) => {
      const prevStatus = joinLobbyRow ? joinLobbyRow.status : null;
      const prevWordIndex = joinLobbyRow ? joinLobbyRow.current_word_index : null;
      joinLobbyRow = updatedLobby;

      if(updatedLobby.status !== 'playing') return;

      const justStarted = prevStatus !== 'playing';
      const newWord = prevWordIndex !== updatedLobby.current_word_index;
      if(justStarted || newWord){
        joinStartWord();
      }
    });
  }
</script>

</body>
</html>
</html>
