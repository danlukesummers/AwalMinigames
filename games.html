<!-- Hangman SVG icon replacement -->
<script>
(function () {

  function addHangmanIcon() {

    const grid = document.getElementById("game-library-grid");

    if (!grid) return;

    /*
      Find the game card containing "Hangman".
      This works with the cards generated by main.js.
    */
    const elements = grid.querySelectorAll("*");

    let hangmanCard = null;

    elements.forEach(function (element) {

      if (
        element.children.length === 0 &&
        element.textContent.trim().toLowerCase() === "hangman"
      ) {

        /*
          Walk upwards until we find the game card.
          We check several common class names so this does
          not interfere with the rest of the site.
        */
        hangmanCard =
          element.closest(".game-card") ||
          element.closest(".game-pick") ||
          element.closest(".game-card-item") ||
          element.parentElement?.parentElement;

      }

    });

    if (!hangmanCard) return;

    /*
      Look for the existing icon area.
    */
    const icon =
      hangmanCard.querySelector(".game-icon") ||
      hangmanCard.querySelector(".gc-icon") ||
      hangmanCard.querySelector(".card-icon") ||
      hangmanCard.querySelector(".game-card-icon") ||
      hangmanCard.querySelector(".gp-icon");

    if (!icon) return;

    /*
      Don't add it twice.
    */
    if (icon.querySelector(".awal-hangman-svg")) return;

    /*
      Replace the existing emoji/icon with the new SVG.
    */
    icon.innerHTML = "";

    const img = document.createElement("img");

    img.src = "assets/icons/hangman.svg";
    img.alt = "Hangman";
    img.className = "awal-hangman-svg";

    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "contain";
    img.style.display = "block";

    icon.appendChild(img);
  }


  /*
    main.js may populate the game library after the page loads,
    so we watch the game grid for changes.
  */
  const observer = new MutationObserver(function () {
    addHangmanIcon();
  });


  function startHangmanIconWatcher() {

    const grid = document.getElementById("game-library-grid");

    if (!grid) return;

    observer.observe(grid, {
      childList: true,
      subtree: true
    });

    addHangmanIcon();
  }


  if (document.readyState === "loading") {

    document.addEventListener(
      "DOMContentLoaded",
      startHangmanIconWatcher
    );

  } else {

    startHangmanIconWatcher();

  }

})();
</script>

</body>
